<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — SRT Royal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --gold: #C9A24B; --bg: #0B0F1F; --card: #121729; --border: rgba(201,162,75,.16); --text: #E4E6F0; --muted: #8B92A8; --error: #E5686B; --success: #34A67A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; border-bottom: 1px solid var(--border); }
    .topbar a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .topbar a:hover { color: var(--gold); }
    .logo { color: var(--text); font-weight: 800; font-size: 18px; letter-spacing: .5px; }
    .logo span { color: var(--gold); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 420px; }
    h1 { font-size: 22px; margin-bottom: 8px; font-family: 'Fraunces', serif; font-weight: 600; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0B0F1F; color: var(--text); font-size: 15px; outline: none; }
    input:focus { border-color: var(--gold); }
    button { width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 999px; background: var(--gold); color: #0B0F1F; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { display: none; margin-top: 14px; font-size: 14px; line-height: 1.5; }
    .msg.error { color: var(--error); display: block; }
    .msg.success { color: var(--success); display: block; }
    .msg a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="index.html">SRT <span>Royal</span></a>
    <a href="Login_page.html">← Back to sign in</a>
  </div>

  <main>
    <div class="card">
      <h1>Reset your password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8" />
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat the new password" required minlength="8" />
        <button type="submit" id="submitBtn"><span>Update password</span></button>
      </form>

      <p class="msg" id="message"></p>
    </div>
  </main>

  <script>
    const message = document.getElementById('message');
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      form.style.display = 'none';
      message.className = 'msg error';
      message.textContent = 'This reset link is missing its token. Please request a new link from the sign-in page.';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = 'msg';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        message.className = 'msg error';
        message.textContent = '❌ The two passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Could not reset the password.');
        form.style.display = 'none';
        message.className = 'msg success';
        message.innerHTML = '✅ ' + data.message + ' <a href="Login_page.html">Go to sign in →</a>';
      } catch (err) {
        message.className = 'msg error';
        message.textContent = '❌ ' + err.message;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
